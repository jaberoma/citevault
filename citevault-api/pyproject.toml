[project]
name = "citevault"
version = "0.1.0"
description = "Local-first grounded AI résumé tailoring"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2",
  "httpx>=0.27",
  "pypdf>=4.3",
  "pdfplumber>=0.11",
  "markdown-it-py>=3.0",
  "weasyprint>=62.0",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "fastapi>=0.136.1",
  "uvicorn>=0.46.0",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.111",
  "mypy>=1.11",
  "ruff>=0.6",
  "respx>=0.21",
]

[project.scripts]
citevault = "citevault.adapters.inbound.cli.citevault:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citevault"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = ["src/citevault/domain"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
